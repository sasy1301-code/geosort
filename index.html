<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מרכז לקוחות — ישראל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root{
    --ink:#12242C;
    --ink-2:#1B3540;
    --paper:#ECE7DC;
    --paper-2:#F5F1E7;
    --teal:#1E7A73;
    --gold:#C79A2E;
    --rust:#A85C32;
    --plum:#6B4C7A;
    --slate:#3E5C76;
    --moss:#5C7A3A;
    --line:rgba(18,36,44,.14);
    --text:#12242C;
    --muted:#5B6B6A;
    --danger:#9C3B2E;
    --radius:15px;
  }
  *{box-sizing:border-box;}
  button, input, select, textarea{ font-family:inherit; font-weight:inherit; }
  /* field-use ergonomics: remove the grey tap-flash on touch, prevent accidental
     double-tap-zoom on buttons, and stop tap targets being text-selected on long-press */
  button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; }
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Google Sans', 'Roboto', -apple-system, "Segoe UI", "Noto Sans Hebrew", Arial, sans-serif;
    background:#e8e9ee;
    color:var(--text);
    overflow:hidden;
    -webkit-text-size-adjust:100%; -moz-text-size-adjust:100%; text-size-adjust:100%; /* stop mobile browsers auto-inflating some text */
  }
  #bgImage{
    display:none;
    position:fixed; inset:-15%; z-index:-1; pointer-events:none;
    background:
      radial-gradient(circle at 50% 50%, rgba(0,0,0,.7) 0%, rgba(0,0,0,.35) 30%, transparent 60%),
      radial-gradient(ellipse 60% 45% at 22% 28%, rgba(90,60,220,.55), transparent 60%),
      radial-gradient(ellipse 55% 50% at 78% 22%, rgba(160,40,190,.45), transparent 60%),
      radial-gradient(ellipse 65% 55% at 65% 75%, rgba(40,70,210,.5), transparent 60%),
      radial-gradient(ellipse 50% 45% at 15% 78%, rgba(120,30,170,.4), transparent 60%),
      radial-gradient(circle at 50% 50%, #0a1030 0%, #050818 55%, #020410 100%);
    background-size:180% 180%;
    filter:saturate(1.15);
    animation:bgDrift 26s ease-in-out infinite alternate;
    will-change:background-position, transform;
  }
  body.bg-anim-paused #bgImage{ animation-play-state:paused; }
  @keyframes bgDrift{
    0%{ background-position:20% 30%; transform:scale(1); }
    50%{ background-position:60% 60%; transform:scale(1.06); }
    100%{ background-position:80% 20%; transform:scale(1.1); }
  }
  #starfield{
    position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; display:none;
  }
  .app{
    height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    z-index:1;
  }
  header{
    background:transparent;
    color:var(--paper-2);
    height:76px;
    padding:0 22px;
    position:relative;
    overflow:hidden;
    flex:0 0 auto;
  }
  .header-logo{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    height:46px; width:auto; z-index:1;
  }
  header .actions{
    position:absolute; left:22px; top:50%; transform:translateY(-50%);
    display:flex; gap:10px; z-index:2;
  }
  /* ---- dark slide-out drawer with the open_2.svg edge tab ---- */
  .side-menu{
    position:fixed; top:0; right:0; height:100vh; width:280px; max-width:100vw; z-index:6000;
    background:#0f1a2e;
    /* closed: a thin strip of the drawer stays peeking on the right edge, full height.
       no box-shadow while closed, so the strip meets the page with a clean edge (the
       shadow only appears once the drawer is open) */
    transform:translateX(calc(100% - 6px));
    /* transform is driven by the open/close keyframes below (with an 8px overshoot bounce) */
    transition:box-shadow .55s ease;
    box-sizing:border-box; padding:56px 30px 30px;
  }
  .side-menu.open{ transform:translateX(0); box-shadow:-12px 0 40px rgba(0,0,0,.45); animation:drawerIn .6s ease-out both; }
  .side-menu.closing{ animation:drawerOut .5s ease-out both; }
  /* slide in, then recoil 8px back toward closed and settle — a soft bounce at the end */
  @keyframes drawerIn{
    0%{ transform:translateX(calc(100% - 6px)); }
    62%{ transform:translateX(0); }
    80%{ transform:translateX(8px); }
    100%{ transform:translateX(0); }
  }
  /* slide out, then recoil 8px back toward open and settle — same bounce on exit */
  @keyframes drawerOut{
    0%{ transform:translateX(0); }
    62%{ transform:translateX(calc(100% - 6px)); }
    80%{ transform:translateX(calc(100% - 14px)); }
    100%{ transform:translateX(calc(100% - 6px)); }
  }
  .side-menu-overlay{
    position:fixed; inset:0; background:rgba(10,15,30,.4); z-index:5999;
    opacity:0; pointer-events:none; transition:opacity .5s cubic-bezier(.16,1,.3,1);
  }
  .side-menu-overlay.open{ opacity:1; pointer-events:auto; }
  /* the tab is the open_2.svg bump on the panel's left edge; the navy strip blends into the
     panel and only the half-circle bump + blue chevron protrude, riding in with the panel */
  .side-menu-tab{
    position:absolute; top:-38px; left:-33px; width:47px; height:198px;
    background:none; border:none; padding:0; cursor:pointer; z-index:1;
    /* no shadow, so the svg strip meets the panel's peek strip as one flat 6px line */
  }
  .side-menu-tab svg{ display:block; width:47px; height:198px; }
  /* only the chevron flips (to the close direction) with an animation when the drawer is open */
  .side-menu-tab .chev{ transform-box:fill-box; transform-origin:center; transition:transform .35s ease; }
  .side-menu.open .side-menu-tab .chev{ transform:scaleX(-1); }
  /* logo above the menu items — 250px, with a 50px gap pushing the buttons down */
  .side-menu-logo{ margin:0 -30px 50px; display:flex; justify-content:center; }
  .side-menu-logo img{
    width:160px; max-width:100%; height:auto; display:block; transform-origin:center;
    /* cool entrance: springs + spins in when the drawer opens (settles back on close) */
    opacity:0; transform:scale(.35) rotate(-16deg);
    transition:opacity .5s ease, transform .75s cubic-bezier(.34,1.5,.5,1);
  }
  .side-menu.open .side-menu-logo img{ opacity:1; transform:scale(1) rotate(0deg); transition-delay:.06s; }
  .side-menu-items{ display:flex; flex-direction:column; gap:26px; margin-top:8px; }
  .side-menu-item{
    display:flex; align-items:center; justify-content:flex-start; gap:30px; width:100%;
    background:none; border:none; cursor:pointer; text-decoration:none;
    color:#fff; font-family:inherit; font-size:12pt; font-weight:400; padding:0;
    -webkit-text-size-adjust:100%; text-size-adjust:100%; /* keep every item at exactly 12pt on mobile */
    /* resting/closing state: tucked to the right, shrunk & faded (snappy exit) */
    opacity:0; transform:translateX(28px) scale(.88);
    transition:opacity .28s ease, transform .34s cubic-bezier(.16,1,.3,1);
  }
  /* opening: each item "inflates" in — pops to full size & slides into place, staggered */
  .side-menu.open .side-menu-item{
    opacity:1; transform:translateX(0) scale(1);
    transition:opacity .5s ease, transform .62s cubic-bezier(.34,1.42,.5,1);
  }
  .side-menu.open .side-menu-item:nth-child(1){ transition-delay:.12s; }
  .side-menu.open .side-menu-item:nth-child(2){ transition-delay:.19s; }
  .side-menu.open .side-menu-item:nth-child(3){ transition-delay:.26s; }
  .side-menu.open .side-menu-item:nth-child(4){ transition-delay:.33s; }
  .side-menu.open .side-menu-item:nth-child(5){ transition-delay:.40s; }
  .side-menu-item .txt{ font-size:12pt; font-weight:400; line-height:1.2; font-family:inherit; }
  .side-menu-item .icon{ width:27px; height:27px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .side-menu-item .icon svg{ width:27px; height:27px; display:block; fill:#0277fb; }
  .side-menu-item:hover .txt{ color:#2f7cf6; }
  header button.ghost, header a.ghost{
    background:transparent; border:1px solid rgba(245,241,231,.35); color:#0f1a2e;
    padding:7px 12px; border-radius:15px; font-size:.95rem; font-family:inherit; font-weight:400; cursor:pointer;
  }
  header button.ghost:hover, header a.ghost:hover{ background:rgba(245,241,231,.12); }

  .main{
    flex:1 1 auto;
    display:flex;
    min-height:0;
  }
  .sidebar{
    width:400px;
    flex:0 0 400px;
    background:transparent;
    border-left:none;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .sidebar .scroll{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 16px 90px;
    scrollbar-width:thin;
    scrollbar-color:#0277fb transparent;
    overscroll-behavior:contain; /* keep scroll momentum inside the sidebar, no page-level bounce */
    -webkit-overflow-scrolling:touch; /* smooth inertial scrolling on iOS */
  }
  /* the old 0.5px scrollbar was effectively invisible and impossible to grab — give it a
     real, thumb-able width so the sidebar can be scrolled by dragging, not only by wheel */
  .sidebar .scroll::-webkit-scrollbar{ width:7px; }
  .sidebar .scroll::-webkit-scrollbar-track{ background:transparent; }
  .sidebar .scroll::-webkit-scrollbar-thumb{
    background:#0277fb; border-radius:15px;
  }
  .sidebar .scroll::-webkit-scrollbar-thumb:hover{ background:#0261cc; }
  .animated-collapse{
    overflow:hidden; max-height:0; opacity:0;
    transition: max-height .65s cubic-bezier(.4,0,.2,1), margin-top .65s cubic-bezier(.4,0,.2,1), opacity .55s ease;
  }
  .animated-collapse.is-open{ opacity:1; }
  /* a collapsed folder body must take zero vertical space — otherwise its 6/2px padding
     leaks through the max-height:0 clip and adds ~8px on top of the 8px group gap */
  .cluster-body.animated-collapse:not(.is-open){ padding-top:0; padding-bottom:0; }
  section.panel{
    background:#021236;
    color:#fff;
    border:none;
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:14px;
    box-shadow:0 8px 24px rgba(15,26,46,.12), 0 2px 6px rgba(15,26,46,.08);
  }
  #addClientPanel{
    position:relative;
    background:#0f1a2e;
    border:1px solid rgba(140,160,255,.35);
  }
  #foldersPanel{ background:#007aff; }
  #addFolderBtn{ background:#021236; border:1px solid transparent; box-sizing:border-box; }
  #addFolderBtn:hover{ background:#04205e; }
  #searchPanel{ background:linear-gradient(180deg, #5d03ef 0%, #007aff 100%); }
  #clustersPanel{ background:#5d03ef; }
  section.panel h2{
    font-size:.95rem;
    margin:0 0 10px;
    font-family:'Google Sans', 'Roboto', -apple-system, "Segoe UI", "Noto Sans Hebrew", Arial, sans-serif;
    font-weight:600;
    color:#fff;
    display:flex; align-items:center; gap:8px;
  }
  section.panel h2 .dot{ width:9px;height:9px;border-radius:50%;background:var(--teal); }
  label{ display:block; font-size:.76rem; color:rgba(255,255,255,.62); margin:8px 0 4px; }
  input[type=text], input[type=tel], input[type=number], input[type=date], input[type=email]{
    width:100%; padding:9px 10px; border:1px solid rgba(255,255,255,.22); border-radius:15px;
    font-size:.9rem; background:#fff; color:#021236; font-family:inherit;
  }
  input[type=text]::placeholder, input[type=tel]::placeholder, input[type=number]::placeholder{ color:rgba(2,18,54,.45); }
  input[type=text]:focus, input[type=tel]:focus, input[type=number]:focus{
    outline:2px solid var(--teal); outline-offset:1px; background:#fff;
  }
  select{
    width:100%; padding:9px 10px; border:1px solid rgba(255,255,255,.22); border-radius:15px;
    font-size:.9rem; background:#fff; font-family:inherit; color:#021236;
  }
  select option{ color:#021236; }
  select:focus{ outline:2px solid var(--teal); outline-offset:1px; background:#fff; }
  textarea{
    width:100%; padding:9px 10px; border:1px solid rgba(255,255,255,.22); border-radius:15px;
    font-size:.87rem; font-family:inherit; resize:vertical; min-height:44px;
    background:#fff; color:#021236;
  }
  textarea::placeholder{ color:rgba(2,18,54,.45); }
  .row2{ display:flex; gap:8px; }
  .row2 > div{ flex:1; }
  button.primary{
    margin-top:12px; width:100%; padding:10px; border:none; border-radius:15px;
    background:#1c3fd6; color:#fff; font-size:.9rem; cursor:pointer; font-weight:600;
  }
  button.primary:disabled{ opacity:.55; cursor:default; }
  button.primary:hover:not(:disabled){ background:#1533ad; }
  #addBtn{ background:#007aff; }
  #addBtn:hover:not(:disabled){ background:#0066d6; }
  .error-msg{
    background:#F7E7E2; color:var(--danger); border:1px solid #E3B4A5; border-radius:15px;
    padding:8px 10px; font-size:.8rem; margin-top:10px; display:none;
  }
  .addr-field-wrap{ position:relative; }
  .biz-lookup-row{ margin-top:6px; }
  #bizLookupBtn{
    width:100%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.3); color:#fff;
    padding:7px 10px; border-radius:15px; font-size:.8rem; cursor:pointer;
  }
  #bizLookupBtn:hover{ background:rgba(255,255,255,.18); }
  #bizLookupBtn:disabled{ opacity:.6; cursor:default; }
  .biz-lookup-suggestions{ margin-top:6px; }
  .biz-lookup-suggestions .suggestion-item{
    padding:9px 10px; font-size:.82rem; cursor:pointer; border:1px solid rgba(255,255,255,.18);
    border-radius:15px; margin-bottom:6px; display:flex; gap:8px; align-items:flex-start; color:#fff;
    background:#021236;
  }
  .biz-lookup-suggestions .suggestion-item:hover{ background:#0a2568; }
  .suggestions{
    position:absolute; top:100%; right:0; left:0; z-index:500;
    background:#021236; border:1px solid rgba(255,255,255,.18); border-radius:15px;
    box-shadow:0 6px 18px rgba(0,0,0,.35); margin-top:4px; max-height:220px; overflow-y:auto;
    display:none;
  }
  .suggestions.open{ display:block; }
  .suggestion-item{
    padding:9px 10px; font-size:.82rem; cursor:pointer; border-bottom:1px solid rgba(255,255,255,.12);
    display:flex; gap:8px; align-items:flex-start; color:#fff;
  }
  .suggestion-item:last-child{ border-bottom:none; }
  .suggestion-item:hover{ background:rgba(255,255,255,.08); }
  .suggestion-item .num{
    flex:0 0 auto; width:18px; height:18px; border-radius:50%; background:var(--gold); color:#fff;
    font-size:.68rem; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .suggestion-item .txt .main{ font-weight:600; }
  .suggestion-item .txt .sub{ color:rgba(255,255,255,.55); font-size:.74rem; margin-top:1px; }
  .suggest-hint{ font-size:.74rem; color:rgba(255,255,255,.55); margin-top:6px; }
  .search-box{ position:relative; }
  .search-box input{ padding-right:32px; }
  .search-box svg{ position:absolute; right:9px; top:9px; width:16px; height:16px; opacity:.6; stroke:#021236; }

  .slider-row{ display:flex; align-items:center; gap:10px; margin-top:4px; }
  input[type=range]{
    flex:1; -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:6px; border-radius:15px;
    background: linear-gradient(to left, #ffa90d 0%, #ffa90d var(--fill-pct, 30%), #fff var(--fill-pct, 30%), #fff 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#ffa90d; border:2px solid #fff; margin-top:-5px; cursor:pointer;
  }
  input[type=range]::-moz-range-track{
    height:6px; border-radius:15px;
    background: linear-gradient(to left, #ffa90d 0%, #ffa90d var(--fill-pct, 30%), #fff var(--fill-pct, 30%), #fff 100%);
  }
  input[type=range]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%; background:#ffa90d; border:2px solid #fff; cursor:pointer;
  }
  .slider-val{ font-size:.78rem; color:rgba(255,255,255,.6); min-width:52px; text-align:left; }

  .cluster-group{ margin-bottom:10px; }
  .cluster-group[draggable="true"] > .cluster-head{ cursor:grab; }
  .cluster-group.dragging{ opacity:.4; }
  .cluster-head{
    display:flex; align-items:center; gap:3px; padding:8px 10px; border-radius:15px;
    background:rgba(255,255,255,.06); cursor:pointer; border:1px solid rgba(255,255,255,.14); color:#fff;
  }
  .cluster-head:hover{ background:rgba(255,255,255,.12); }
  .cluster-swatch{ width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .cluster-head .name{ font-weight:600; font-size:.85rem; flex:1; color:#fff; }
  .cluster-head .count{
    flex:0 0 auto; width:30px; height:30px; padding:0; border-radius:50%;
    background:#0f1a2e; color:#fff; font-size:.86rem; font-weight:400; line-height:1;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .cluster-head .folder-del{
    flex:0 0 auto; background:transparent; border:none; color:#e08b7d; cursor:pointer;
    font-size:.85rem; padding:2px 6px; border-radius:15px;
  }
  .cluster-head .folder-del:hover{ background:rgba(224,139,125,.18); }
  .cluster-head .route-toggle{
    flex:0 0 auto; background:transparent; border:none; color:rgba(255,255,255,.6); cursor:pointer;
    font-size:.85rem; padding:2px 5px; border-radius:15px;
  }
  .cluster-head .route-toggle:hover{ background:rgba(255,255,255,.14); color:#fff; }
  .cluster-head .route-toggle.active{ background:var(--gold); color:#021236; }
  .cluster-head .rename-cluster, .cluster-head .reset-cluster-name, .cluster-head .rename-folder{
    flex:0 0 auto; background:transparent; border:none; color:rgba(255,255,255,.6); cursor:pointer;
    font-size:.8rem; padding:2px 5px; border-radius:15px;
  }
  .cluster-head .rename-cluster:hover, .cluster-head .reset-cluster-name:hover, .cluster-head .rename-folder:hover{ background:rgba(255,255,255,.14); color:#fff; }
  .cluster-head .map-visibility-toggle{
    flex:0 0 auto; background:transparent; border:none; color:rgba(255,255,255,.75); cursor:pointer;
    font-size:.85rem; padding:2px 6px; border-radius:15px;
  }
  .cluster-head .map-visibility-toggle:hover{ background:rgba(255,255,255,.14); }
  .cluster-head .map-visibility-toggle.off{ color:#e08b7d; opacity:.85; }

  /* ---- folder cards redesign (client-count folders inside :is(#folderList, #clusterList) only, so the
     clusters panel keeps its own colours) ---- */
  :is(#folderList, #clusterList) .cluster-head{ background:#025ffb; border:1px solid #4394f7; gap:10px; padding:11px 10px; border-radius:15px; }
  :is(#folderList, #clusterList) .cluster-group{ margin-bottom:8px; }
  :is(#folderList, #clusterList) .cluster-head:hover{ background:#1a72ff; }
  /* client-count circle: white with a navy number, folder name Regular @ 15pt */
  :is(#folderList, #clusterList) .cluster-head .count{ background:#fff; color:#0f1a2e; width:28px; height:28px; }
  :is(#folderList, #clusterList) .cluster-head .name{ font-weight:400; font-size:10pt; }
  /* the rename input matches the folder name exactly (Regular, 10pt) so the text
     doesn't jump size/weight when you enter edit mode */
  :is(#folderList, #clusterList) .cluster-head .cluster-rename-input{ font-size:10pt; font-weight:400; }
  /* SVG action icons (eye / clock / pencil / X) sit bare on the blue card.
     each icon carries its own base size in --sz; hovering grows it by 2px. */
  :is(#folderList, #clusterList) .cluster-head button{ display:inline-flex; align-items:center; justify-content:center; line-height:0; padding:2px 0; }
  :is(#folderList, #clusterList) .cluster-head .map-visibility-toggle{ --sz:17px; }
  :is(#folderList, #clusterList) .cluster-head .route-toggle{ --sz:14px; }
  :is(#folderList, #clusterList) .cluster-head .rename-folder{ --sz:13px; }
  :is(#folderList, #clusterList) .cluster-head .rename-cluster{ --sz:13px; }
  :is(#folderList, #clusterList) .cluster-head .folder-del{ --sz:9px; }
  /* the clusters' "reset to auto name" (↺) is a glyph, not an SVG — colour it navy to match */
  #clusterList .cluster-head .reset-cluster-name{ color:#0f1a2e; font-size:15px; }
  :is(#folderList, #clusterList) .cluster-head button svg{ width:var(--sz,19px); height:var(--sz,19px); display:block; }
  /* no hover effect on the icons — they stay put, with no background highlight */
  :is(#folderList, #clusterList) .cluster-head button:hover{ background:transparent; }
  /* press feedback while held down: the navy parts turn pink, matching the X */
  :is(#folderList, #clusterList) .cluster-head button:active svg [fill="#0f1a2e"]{ fill:#ff7bac; }
  /* persistent "pressed" state — the toggle stays pink so you can see it is active.
     these classes are re-applied from state on every render, so a second click
     (which clears the state) returns the icon to navy. */
  :is(#folderList, #clusterList) .cluster-head .map-visibility-toggle.off svg [fill="#0f1a2e"]{ fill:#ff7bac; }
  :is(#folderList, #clusterList) .cluster-head .route-toggle.active svg [fill="#0f1a2e"]{ fill:#ff7bac; }
  /* no background box behind the pressed/active toggle — only the pink icon signals it
     (overrides the global gold .route-toggle.active background) */
  :is(#folderList, #clusterList) .cluster-head .route-toggle.active,
  :is(#folderList, #clusterList) .cluster-head .map-visibility-toggle.off{ background:transparent; }
  /* the אזורים / אשכולות (region) cards keep their own look: deep purple, not the
     folders' blue, with 8px of air between each card (same source-order specificity as
     the shared :is() block above, so being later here is what makes these win) */
  #clusterList .cluster-head{ background:#5a19bf; border:1px solid #8871d9; }
  #clusterList .cluster-head:hover{ background:#6a2ad6; }
  .cluster-rename-input{
    flex:1; font-size:.85rem; font-weight:600; border:1px solid var(--teal); border-radius:15px;
    padding:3px 7px; background:#fff; font-family:inherit; color:#021236; min-width:0;
  }
  input.folder-color-input, input.folder-swatch{

  .share-choice-menu{

  .client-card .whatsapp-btn svg{ display:block; width:25px; height:25px; }
  .client-card .caddr{ font-size:.82rem; color:#fff; margin-top:3px; }
  .client-card .cphone{ font-size:.82rem; color:#fff; margin-top:3px; }
  .client-card .phone-link{ color:#4394f7; text-decoration:underline; cursor:pointer; }
  .client-card .phone-link:hover{ color:#7fb5fa; }
  .client-card .cprice{ font-size:.82rem; color:rgba(255,255,255,.75); }
  .client-card .cprice-vat{ margin-top:4px; }
  .client-card .cdiscount-row{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .client-card .cdiscount-label{ font-size:.82rem; color:rgba(255,255,255,.75); flex:0 0 auto; }
  .client-card .card-discount-input{

  .client-card .cnotes-block{

  .client-card .cnotes-title{ font-size:.82rem; font-weight:700; color:#fff; }
  .client-card .cnotes-text{
    font-size:.8rem; color:rgba(255,255,255,.85); margin-top:3px; white-space:pre-wrap; word-break:break-word;

  .updates-log{

  .updates-log-title{ font-size:.82rem; font-weight:700; color:#fff; margin-bottom:3px; }

  .edit-update-add-row{ display:flex; gap:6px; margin-bottom:8px; }

  .client-card .invoice-divider{
    border-top:1px dashed rgba(255,255,255,.18); margin-top:16px;
  }
  .client-card .invoice-field{
    display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px;

  .client-card .invoice-field label{ font-size:.75rem; color:rgba(255,255,255,.6); margin:0; flex:0 0 auto; }
  .client-card .invoice-field input{ width:90px; padding:5px 8px; font-size:.82rem; }
  .client-card select.move-select, .client-card select.temp-folder-select{

  }
  .temp-folder-badge{
    display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap;
    font-size:.7rem; color:#ffd479; background:rgba(255,183,0,.15); border:1px solid rgba(255,183,0,.4);
    border-radius:15px; padding:5px 8px; margin-top:6px;
  }
  .remove-temp-btn{
    background:transparent; border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:15px;
    padding:2px 6px; font-size:.68rem; cursor:pointer; flex:0 0 auto;
  }
  .remove-temp-btn:hover{ background:rgba(255,255,255,.15); }
  .client-card .cactions{ display:flex; gap:5px; margin-top:14px; margin-bottom:8px; align-items:center; position:relative; }
  .more-options-menu{
    position:absolute; left:0; bottom:calc(100% + 6px); z-index:30; background:#0f1a2e;
    border:1px solid #0277fb; border-radius:25px; box-shadow:0 10px 30px rgba(0,0,0,.5);
    width:217px; height:auto; box-sizing:border-box; padding:3px 15px;
    display:flex; flex-direction:column;
    /* iOS Safari-style context-menu open: springs up from the + button with a soft
       overshoot-and-settle and a subtle blur-in, so it flows rather than jumps */
    transform-origin:bottom left;
    animation:moMenuOpen .44s cubic-bezier(.34,1.56,.64,1) both;
    will-change:transform, opacity, filter;
  }
  @keyframes moMenuOpen{
    0%{ transform:scale(.3); opacity:0; filter:blur(6px); }
    38%{ opacity:1; filter:blur(0); }
    100%{ transform:scale(1); opacity:1; filter:blur(0); }
  }
  /* closing: dissolves back down toward the button */
  .more-options-menu.mo-closing{
    animation:moMenuClose .22s cubic-bezier(.4,0,.7,1) both; pointer-events:none;
  }
  @keyframes moMenuClose{
    0%{ transform:scale(1); opacity:1; filter:blur(0); }
    100%{ transform:scale(.4); opacity:0; filter:blur(4px); }
  }
  /* icon on the right, text right-aligned next to it (RTL: first child sits at the right).
     high specificity so it beats ".client-card .cactions button" (which adds a gray fill+border) */
  .client-card .cactions .more-options-menu button{
    flex:0 0 auto; height:49px; display:flex; align-items:center; justify-content:flex-start; gap:16px; width:100%;
    background:transparent; border:none; border-radius:0; color:#fff; text-align:right;
    font-family:inherit; font-size:14px; font-weight:400; padding:0 4px 0 0; cursor:pointer; box-sizing:border-box;
  }
  /* icon sits inside a wrapper span; the hover circle lives on the SPAN (not the svg) so it
     works on iOS Safari too — Safari clips an SVG to its own border-radius even with
     overflow:visible, which was cropping the icons on mobile */
  .more-options-menu button .mo-ico{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, box-shadow .15s ease;
  }
  .more-options-menu button .mo-ico svg{ width:22px; height:22px; display:block; overflow:visible; }
  /* on hover: a circle around the icon in the client-card hover colour, 8px larger radius */
  .more-options-menu button:hover .mo-ico{ background:#040f1e; box-shadow:0 0 0 8px #040f1e; }
  /* line.svg is a ~0.2px hairline that won't show at row height, so render its line
     crisply: thin #0277fb bar, full width, with the same faded ends line.svg has */
  .more-options-menu .mo-line{
    display:block; width:100%; height:0.5px; flex:0 0 auto; background:#0277fb;
    -webkit-mask:linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
    mask:linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
  }
  .more-options-menu .mo-line svg{ display:none; }
  .client-card .cactions .icon-circle-btn{
    display:flex; align-items:center; justify-content:center;
    flex:1 1 0; width:0; aspect-ratio:1/1; border-radius:50%; background:#fff; border:1px solid #999;
    cursor:pointer; padding:0; min-width:0; color:var(--icon-color, #333); will-change:transform;
    /* release springs back with a soft overshoot bounce */
    transition:transform .34s cubic-bezier(.34,1.56,.64,1), background .1s ease, color .1s ease;
  }
  .client-card .cactions .icon-circle-btn svg{ display:block; width:60%; height:60%; }
  .client-card .cactions .icon-circle-btn:active,
  .client-card .cactions .icon-circle-btn.active{
    background:var(--icon-color, #333); color:#fff;
  }
  /* tap feedback: quick dip on press (only while physically held, not on persistent .active) */
  .client-card .cactions .icon-circle-btn:active{
    transform:scale(.82);
    transition:transform .08s ease, background .1s ease, color .1s ease;
  }
  .client-card .cactions .icon-circle-btn.toggle-skip.active{ opacity:.55; }
  .client-card .cactions button{
    font-size:.72rem; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#fff; border-radius:15px;
    padding:3px 8px; cursor:pointer;
  }
  .client-card .cactions button:disabled{ opacity:.3; cursor:default; }
  .client-card .cactions button.del{ color:#e08b7d; }

  .empty{
    text-align:center; color:rgba(255,255,255,.55); font-size:.85rem; padding:26px 10px;
  }

  .map-wrap{ flex:1 1 auto; position:relative; min-height:0; padding:0; background:transparent; }
  #map{
    position:absolute; inset:0; border-radius:0; overflow:hidden;
    border:none;
  }
  /* refresh / show-all / background buttons, centered above "הוספת לקוח" at the top of the sidebar */
  .map-actions{
    flex:0 0 auto; display:flex; justify-content:center; align-items:center;
    gap:10px; padding:12px 10px; flex-wrap:wrap;
  }
  .map-actions button.ghost{
    background:transparent; border:1px solid rgba(15,26,46,.3); color:#0f1a2e;
    padding:7px 14px; border-radius:999px; font-size:.95rem; font-family:inherit; font-weight:400; cursor:pointer;
  }
  .map-actions button.ghost:hover{ background:rgba(15,26,46,.06); }
  .leaflet-popup-content{ font-family:inherit; direction:rtl; }

  footer.note{
    flex:0 0 auto; background:var(--ink); color:var(--paper-2); font-size:.72rem;
    padding:6px 20px; text-align:center; opacity:.85;
    padding-bottom:calc(6px + env(safe-area-inset-bottom)); /* clear the iPhone home-bar */
  }
  footer.note b{ color:var(--gold); }

  /* on desktop, drop the whole panel stack (add-client / search / folders / clustering)
     10px lower together so it clears the menu tab on the right edge */
  @media (min-width:861px){
    .sidebar .scroll{ padding-top:36px; }
    .inventory-modal .stock-remaining{ position:absolute; left:50%; top:50%; transform:translate(-50%, calc(-50% + 6px)); margin:0; }
  }

  @media (max-width:860px){
    .main{ flex-direction:column; gap:0; }
    .sidebar{ width:100%; flex:1 1 auto; min-height:0; border-left:none; border-top:none; order:2; }
    .map-wrap{ order:1; height:40vh; flex:0 0 auto; }
    .map-actions{ padding:8px; gap:6px; }
    .map-actions button.ghost{ padding:5px 8px; font-size:.82rem; white-space:nowrap; }
    /* on phones the tab rides over the map — drop it 40px so it sits toward the map's middle */
    .side-menu-tab{ top:5px; }
    section.panel{ margin-bottom:10px; }
    .stock-row{ gap:0; font-size:.72rem; align-items:flex-start; justify-content:space-between; }
    .stock-name{ flex:0 0 auto; flex-direction:column; align-items:center; text-align:center; }
    .stock-name-block{ flex-direction:column; align-items:center; text-align:center; white-space:normal; gap:0; }
    .stock-remaining{ flex:0 0 auto; flex-direction:column; align-items:center; text-align:center; gap:0; font-size:.72rem; }
    .stock-remaining b{ font-size:.8rem; }
    input.stock-qty-input{ width:70px; font-size:.75rem; padding:2px 4px; }
    .stock-complete-block{ flex:0 0 auto; flex-direction:column; align-items:center; text-align:center; gap:0; }
    .stock-complete-label{ font-size:.68rem; }
    .stock-complete-num{ font-size:.9rem; min-width:16px; }
    .stock-left-block{ flex:0 0 auto; flex-direction:column; align-items:center; text-align:center; gap:0; }
    .stock-left-label{ font-size:.68rem; }
    .stock-left-num{ font-size:.9rem; min-width:16px; }
    .stock-reset-one{ font-size:.68rem; padding:2px; flex:0 0 auto; }

    /* ---- field-use ergonomics on phones (added) ---- */
    /* 16px inputs stop iOS from auto-zooming the whole page in every time a field is
       focused — the single biggest annoyance when adding a client one-handed */
    input[type=text], input[type=tel], input[type=number], input[type=date],
    input[type=email], select, textarea{ font-size:16px; }
    /* keep all the round action buttons on a single row (no wrapping) — they share the
       width evenly and shrink to fit however many there are */
    .client-card .cactions{ flex-wrap:nowrap; gap:5px; }
    .client-card .cactions .icon-circle-btn{
      flex:1 1 0; width:auto; min-width:0; max-width:none; min-height:0;
    }
    /* nudge the smallest secondary text up so it stays readable in bright sunlight */
    .leg-connector .leg-info{ font-size:.72rem; }
    .client-card select.move-select, .client-card select.temp-folder-select{ font-size:16px; }
    .client-card .caddr, .client-card .cphone, .client-card .cbillname{ font-size:.86rem; }
    /* give the tappable links (Waze / phone / email) a bit more vertical breathing
       room so they're easier to hit accurately */
    .client-card .phone-link{ padding:2px 0; display:inline-block; }
  }

</style>

    function spawnMeteor(){
      const angle = Math.random() * Math.PI * 2;
      const startDist = Math.max(canvas.width, canvas.height) * 0.15;
      const cx = canvas.width / 2, cy = canvas.height / 2;
      meteors.push({
        x: cx + Math.cos(angle) * startDist * (Math.random()*0.4),
        y: cy + Math.sin(angle) * startDist * (Math.random()*0.4),
        vx: Math.cos(angle) * (7 + Math.random()*5),
        vy: Math.sin(angle) * (7 + Math.random()*5),
        life: 0,
        maxLife: 40 + Math.random() * 20
      });
    }

    resize();
    createStars();
    window.addEventListener('resize', ()=>{ resize(); createStars(); });

    let meteorTimer = 0;

    function frame(t){
      if(paused){ loopRunning = false; return; } // stop scheduling entirely while paused
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const scale = Math.max(canvas.width, canvas.height) * 0.55;

      stars.forEach(s=>{
        // previous projected position (for a short directional streak)
        const prevK = 1 / s.z;
        const prevPx = cx + s.x * prevK * scale * 0.35;
        const prevPy = cy + s.y * prevK * scale * 0.35;

        s.z -= SPEED;
        if(s.z <= 0.02){ Object.assign(s, makeStar()); s.z = 1; }

        const k = 1 / s.z;
        const px = cx + s.x * k * scale * 0.35;
        const py = cy + s.y * k * scale * 0.35;

        if(px < -50 || px > canvas.width+50 || py < -50 || py > canvas.height+50){
          Object.assign(s, makeStar());
          return;
        }

        const depthAlpha = Math.min(1, (1 - s.z) * 1.3 + 0.1);
        const twinkle = 0.55 + 0.45 * Math.sin(t * 0.001 * s.twinkleSpeed + s.twinklePhase);
        const alpha = Math.max(0, depthAlpha * twinkle);
        const size = Math.max(0.4, (1 - s.z) * s.r * 2.2);

        const warmth = s.tint;
        const color = `rgba(${220 + warmth*20},${225 + warmth*10},255,${alpha.toFixed(3)})`;

        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.beginPath();
        ctx.moveTo(prevPx, prevPy);
        ctx.lineTo(px, py);
        ctx.stroke();
      });

      // meteors: occasional fast bright streaks shooting outward from near the center
      meteorTimer++;
      if(meteorTimer > 140 + Math.random()*160){
        spawnMeteor();
        meteorTimer = 0;
      }
      meteors = meteors.filter(m => m.life < m.maxLife);
      meteors.forEach(m=>{
        const prevX = m.x, prevY = m.y;
        m.x += m.vx;
        m.y += m.vy;
        m.life++;
        const fade = 1 - (m.life / m.maxLife);
        ctx.strokeStyle = `rgba(255,250,230,${Math.max(0,fade).toFixed(3)})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(prevX - m.vx*4, prevY - m.vy*4);
        ctx.stroke();
      });

      requestAnimationFrame(frame);
    }

      const btn = document.getElementById('animToggleBtn');

  function routeFingerprint(orderedMembers){

  // asks OSRM's public routing service for the real road-following path (and real
  // per-leg + total distance/duration) between an ordered list of stops. This is a
  // free public demo server (no API key), so results are cached per folder and only
  // re-fetched when the actual stop order/composition changes.
  async function fetchRoadRoute(orderedMembers){
    const coordsParam = orderedMembers.map(c => `${c.lon},${c.lat}`).join(';');
    const url = `https://router.project-osrm.org/route/v1/driving/${coordsParam}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('OSRM request failed');
    const data = await res.json();
    if(data.code !== 'Ok' || !data.routes || !data.routes.length) throw new Error('No route found');
    const route = data.routes[0];
    const coords = route.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
    // use the real road distance (accurate), but compute time ourselves at a
    // conservative city speed - OSRM's own duration is based on speed limits and
    // doesn't account for real traffic/congestion.
    const legs = route.legs.map(l => {
      const km = l.distance/1000;
      return { km, min: Math.max(1, Math.round((km / AVG_SPEED_KMH) * 60)) };
    });
    const totalKm = route.distance/1000;
    return {
      coords, legs,
      totalKm,
      totalMin: Math.max(1, Math.round((totalKm / AVG_SPEED_KMH) * 60))
    };
  }

    const result = await fetchRoadRoute(orderedMembers);
    const entry = { fingerprint: fp, ...result };
    cache[cacheKey] = entry;
    return entry;
  }

  function haversine(lat1,lon1,lat2,lon2){
    const R=6371;
    const dLat=(lat2-lat1)*Math.PI/180;
    const dLon=(lon2-lon1)*Math.PI/180;
    const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  // formats a duration given in minutes as hours+minutes once it's an hour or more
  // (e.g. 138 -> "2 שעות ו-18 דק'"), otherwise just as minutes.
  function formatDuration(totalMinutes){
    const mins = Math.round(totalMinutes);
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if(h === 0) return `${m} דק׳`;
    const hoursPart = h === 1 ? 'שעה' : `${h} שעות`;
    return m === 0 ? hoursPart : `${hoursPart} ו-${m} דק׳`;
  }
  function estimateLeg(c1, c2){
    const km = haversine(c1.lat, c1.lon, c2.lat, c2.lon);
    const minutes = Math.max(1, Math.round((km / AVG_SPEED_KMH) * 60));
    return { km, minutes };
  }

  // orders a cluster's members into an efficient visiting route using a nearest-neighbor
  // heuristic (starts from the northernmost address, then always jumps to the closest
  // unvisited one). Not a perfect shortest-route solver, but gives a sensible, low-zigzag
  // driving order without needing heavy computation.
  function nearestNeighborOrder(memberIndices){
    if(memberIndices.length <= 2) return memberIndices.slice();
    const remaining = memberIndices.slice();
    // start from the northernmost point (highest latitude)
    let startPos = 0;
    for(let i=1;i<remaining.length;i++){
      if(clients[remaining[i]].lat > clients[remaining[startPos]].lat) startPos = i;
    }
    const order = [remaining.splice(startPos,1)[0]];
    while(remaining.length){
      const cur = clients[order[order.length-1]];
      let bestIdx = 0, bestDist = Infinity;
      for(let i=0;i<remaining.length;i++){
        const cand = clients[remaining[i]];
        const d = haversine(cur.lat, cur.lon, cand.lat, cand.lon);
        if(d < bestDist){ bestDist = d; bestIdx = i; }
      }
      order.push(remaining.splice(bestIdx,1)[0]);
    }
    return order;
  }

  // ids the user has just deleted on this device - the merge-safe save below must

  // silently undoes itself a moment later
  const recentlyDeletedClientIds = new Set();
  // same idea, but for individual order records (e.g. removed via the duplicate-
  // orders cleanup, or the 🗑 button in order history) - without this, the merge
  // logic below would "recover" a just-deleted order back from the server
  const recentlyDeletedOrderIds = new Set();
  const recentlyDeletedUpdateIds = new Set();

  function saveData(){

  async function doSaveData(){
    try{
      // fetch the current server state first and merge it into what we're about to
      // save - this prevents a device with stale/older data from silently wiping
      // out newer changes made elsewhere (whether that's a whole client that's
      // missing locally, or just a new order/update added to a client that exists
      // on both sides but whose local copy hasn't seen that addition yet).
      let serverClients = [];
      try{
        const raw = await sbGet(STORAGE_KEY);
        serverClients = raw ? JSON.parse(raw) : [];
      }catch(e){ /* if the fetch fails, just proceed with local data only */ }

      const localById = new Map(clients.map(c => [c.id, c]));
      let changed = false;

      serverClients.forEach(serverC=>{
        const localC = localById.get(serverC.id);
        if(!localC){
          if(recentlyDeletedClientIds.has(serverC.id)) return; // just deleted here - don't resurrect it
          // entire client missing locally (e.g. added on another device) - recover it
          clients.push(serverC);
          changed = true;
          return;
        }
        // client exists on both sides - merge its order history and update log by
        // id, so an entry added elsewhere isn't lost just because this device's
        // copy of the client predates it
        if(Array.isArray(serverC.orders) && serverC.orders.length){
          localC.orders = localC.orders || [];
          const localOrderIds = new Set(localC.orders.map(o => o.id));
          serverC.orders.forEach(o=>{
            if(recentlyDeletedOrderIds.has(o.id)) return; // just deleted here - don't resurrect it
            if(!localOrderIds.has(o.id)){ localC.orders.push(o); changed = true; }
          });
        }
        if(Array.isArray(serverC.updates) && serverC.updates.length){
          localC.updates = localC.updates || [];
          const localUpdateIds = new Set(localC.updates.map(u => u.id));
          serverC.updates.forEach(u=>{
            if(recentlyDeletedUpdateIds.has(u.id)) return; // just deleted here - don't resurrect it
            if(!localUpdateIds.has(u.id)){ localC.updates.push(u); changed = true; }
          });
        }
        // for simple text fields there's no reliable way to know which side is
        // "more recent" without timestamps - but the single most common accident
        // is a stale/blank local copy overwriting a real value entered elsewhere,
        // so guard against exactly that: if this device has nothing here but the
        // server does, keep the server's value instead of blanking it out
        ['notes','phone','email','contact','price','lastInvoice','lastInvoiceDate'].forEach(field=>{
          if(!localC[field] && serverC[field]){
            localC[field] = serverC[field];
            changed = true;
          }
        });
      });

      await sbSet(STORAGE_KEY, JSON.stringify(clients));
      if(changed) renderAll(); // reflect anything recovered/merged from another device
    }catch(e){
      console.error("שגיאת שמירה", e);
    }
  }

  // combines a saved manual order (if any) with a nearest-neighbor placement for any
  // points not yet in that saved order - so new additions are automatically slotted in
  // by shortest distance, while previously-arranged points keep the order you chose.
  // points: [{id, lat, lon}, ...], savedIds: [id, ...] or null/empty for a fresh start.
  // 2-opt local search: repeatedly looks for a pair of legs in the route whose
  // "crossing" can be undone by reversing the segment between them, whenever
  // that shortens the total distance. This is a standard, fast way to turn a
  // decent nearest-neighbor route into a genuinely efficient one, without the
  // cost of solving the full traveling-salesman problem exactly.
  function twoOptImprove(order, byId, maxIterations){
    const n = order.length;
    if(n < 4) return order; // nothing meaningful to improve with fewer than 4 stops
    const limit = maxIterations || 2000;
    let iterations = 0;
    let improved = true;
    while(improved && iterations < limit){
      improved = false;
      for(let i=0; i<n-2; i++){
        const a = byId[order[i]], b = byId[order[i+1]];
        for(let j=i+2; j<n-1; j++){
          const cPt = byId[order[j]], d = byId[order[j+1]];
          const before = haversine(a.lat,a.lon,b.lat,b.lon) + haversine(cPt.lat,cPt.lon,d.lat,d.lon);
          const after = haversine(a.lat,a.lon,cPt.lat,cPt.lon) + haversine(b.lat,b.lon,d.lat,d.lon);
          iterations++;
          if(after + 1e-9 < before){
            let left = i+1, right = j;
            while(left < right){
              const tmp = order[left]; order[left] = order[right]; order[right] = tmp;
              left++; right--;
            }
            improved = true;
            break; // recompute a/b for the new order[i+1] before continuing
          }
          if(iterations >= limit) break;
        }
        if(improved || iterations >= limit) break;
      }
    }
    return order;
  }

  function computeOrderedIds(points, savedIds){
    const byId = {};
    points.forEach(p => { byId[p.id] = p; });
    const allIds = points.map(p => p.id);
    const prefix = (savedIds || []).filter(id => allIds.includes(id));
    let remaining = allIds.filter(id => !prefix.includes(id));
    const order = prefix.slice();

    if(order.length === 0 && remaining.length){
      let startIdx = 0;
      for(let i=1;i<remaining.length;i++){
        if(byId[remaining[i]].lat > byId[remaining[startIdx]].lat) startIdx = i;
      }
      order.push(remaining.splice(startIdx,1)[0]);
    }
    // each remaining (new) member gets inserted right next to whichever existing
    // member in the order it's geographically closest to - rather than always
    // tacking new addresses onto the very end regardless of where they actually are
    while(remaining.length){
      let bestRemIdx = 0, bestOrderIdx = 0, bestDist = Infinity;
      for(let ri=0; ri<remaining.length; ri++){
        const cand = byId[remaining[ri]];
        for(let oi=0; oi<order.length; oi++){
          const existing = byId[order[oi]];
          const d = haversine(existing.lat, existing.lon, cand.lat, cand.lon);
          if(d < bestDist){ bestDist = d; bestRemIdx = ri; bestOrderIdx = oi; }
        }
      }
      const chosenId = remaining.splice(bestRemIdx, 1)[0];
      order.splice(bestOrderIdx + 1, 0, chosenId); // right after its closest match
    }
    // final pass: 2-opt local search over the whole route, swapping pairs of legs
    // whenever doing so shortens the total distance - this is what actually pushes
    // a nearest-neighbor route toward the genuinely most efficient overall order,
    // rather than just "reasonable" neighbor-by-neighbor placement.
    // BUT: only auto-optimize when there is NO saved manual order. Once the user has
    // arranged the stops by hand (drag or typing a position), that arrangement is the
    // source of truth and must NOT be reshuffled by the optimizer on the next render -
    // otherwise manual reordering never "sticks". New addresses added later are still
    // inserted near their closest neighbour above; they just don't trigger a full re-optimize.
    if(prefix.length === 0) twoOptImprove(order, byId);
    return order;
  }

  // if every one of these members belongs to the same single (non-empty) folder,
  // returns that folder - so the cluster can defer its ordering to it, keeping
  // edits made from either the cluster view or the folder view in sync.
  function dominantFolderFor(memberIndices){
    const folderNames = new Set(memberIndices.map(i => clients[i].folder || ""));
    if(folderNames.size !== 1) return null;
    const onlyName = [...folderNames][0];
    if(!onlyName) return null;
    return folders.find(f => f.name === onlyName) || null;
  }

  function getOrderedClusterMembers(cl, memberIndices){
    const folder = dominantFolderFor(memberIndices);
    if(folder){
      const memberClients = memberIndices.map(i => clients[i]);
      const ordered = getOrderedFolderMembers(folder, memberClients);
      return ordered.map(c => memberIndices.find(i => clients[i].id === c.id));
    }
    const points = memberIndices.map(i => ({ id: clients[i].id, lat: clients[i].lat, lon: clients[i].lon }));
    const fullIds = computeOrderedIds(points, clusterOrder[cl.key]);
    return fullIds.map(id => memberIndices.find(i => clients[i].id === id));
  }

  function moveClusterMember(cl, memberIndices, clientId, dir, skippedIndices){
    const ordered = getOrderedClusterMembers(cl, memberIndices);
    const idx = ordered.findIndex(i => clients[i].id === clientId);
    const swapIdx = idx + dir;
    if(idx < 0 || swapIdx < 0 || swapIdx >= ordered.length) return;
    [ordered[idx], ordered[swapIdx]] = [ordered[swapIdx], ordered[idx]];
    const folder = dominantFolderFor(memberIndices);
    if(folder){
      folder.order = ordered.map(i => clients[i].id).concat((skippedIndices||[]).map(i => clients[i].id));
      saveFolders();
    } else {
      clusterOrder[cl.key] = ordered.map(i => clients[i].id);
      saveClusterOrder();
    }
    renderAll();
  }

  function moveClusterMemberToPosition(cl, memberIndices, clientId, newPos, skippedIndices){
    const ordered = getOrderedClusterMembers(cl, memberIndices);
    const curIdx = ordered.findIndex(i => clients[i].id === clientId);
    if(curIdx < 0) return;
    const targetIdx = Math.min(Math.max(1, newPos), ordered.length) - 1;
    if(targetIdx === curIdx) return;
    const [item] = ordered.splice(curIdx, 1);
    ordered.splice(targetIdx, 0, item);
    const folder = dominantFolderFor(memberIndices);
    if(folder){
      folder.order = ordered.map(i => clients[i].id).concat((skippedIndices||[]).map(i => clients[i].id));
      saveFolders();
    } else {
      clusterOrder[cl.key] = ordered.map(i => clients[i].id);
      saveClusterOrder();
    }
    renderAll();
  }

  // same idea, but for a manually-created folder (order is stored directly on the folder object)
  // moves inactive clients to the end of an already-ordered list, preserving
  // relative order within each group - works whether the list holds client
  // objects (folders) or member indices (clusters), via the isInactive callback
  function sinkInactiveToEnd(list, isInactiveFn){
    const active = list.filter(item => !isInactiveFn(item));
    const inactive = list.filter(item => isInactiveFn(item));
    return active.concat(inactive);
  }

  function getOrderedFolderMembers(folder, members){
    const points = members.map(c => ({ id: c.id, lat: c.lat, lon: c.lon }));
    const fullIds = computeOrderedIds(points, folder.order);
    return fullIds.map(id => members.find(c => c.id === id));
  }

  function moveFolderMember(folder, members, clientId, dir, skippedMembers){
    const ordered = getOrderedFolderMembers(folder, members);
    const idx = ordered.findIndex(c => c.id === clientId);
    const swapIdx = idx + dir;
    if(idx < 0 || swapIdx < 0 || swapIdx >= ordered.length) return;
    [ordered[idx], ordered[swapIdx]] = [ordered[swapIdx], ordered[idx]];
    folder.order = ordered.map(c => c.id).concat((skippedMembers||[]).map(c => c.id));
    saveFolders();
    renderAll();
  }

  function moveFolderMemberToPosition(folder, members, clientId, newPos, skippedMembers){
    const ordered = getOrderedFolderMembers(folder, members);
    const curIdx = ordered.findIndex(c => c.id === clientId);
    if(curIdx < 0) return;
    const targetIdx = Math.min(Math.max(1, newPos), ordered.length) - 1;
    if(targetIdx === curIdx) return;
    const [item] = ordered.splice(curIdx, 1);
    ordered.splice(targetIdx, 0, item);
    folder.order = ordered.map(c => c.id).concat((skippedMembers||[]).map(c => c.id));
    saveFolders();
    renderAll();
  }

  // On touch devices (especially iPad) a draggable element ALSO fires the native HTML5
  // drag on a touch-hold, which fights the custom touch-drag reorder and makes the card
  // "fly off". iPhone never native-drags from touch, so it only shows there. Track when a
  // finger is down so the native dragstart can be cancelled during touch.
  let touchDragActive = false;
  document.addEventListener('touchstart', ()=>{ touchDragActive = true; }, { passive:true, capture:true });
  const clearTouchDragActive = ()=>{ setTimeout(()=>{ touchDragActive = false; }, 60); };
  document.addEventListener('touchend', clearTouchDragActive, { passive:true, capture:true });
  document.addEventListener('touchcancel', clearTouchDragActive, { passive:true, capture:true });

  // returns the card element that the dragged card should be placed BEFORE,
  // based on the mouse's vertical position within the container (null = place last)
  function getDragAfterElement(container, y, selector){
    const els = [...container.querySelectorAll((selector || '.client-card') + ':not(.dragging):not(.touch-dragging)')];
    return els.reduce((closest, child)=>{
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if(offset < 0 && offset > closest.offset) return { offset, element: child };
      return closest;
    }, { offset: -Infinity }).element;
  }

  // FLIP technique: measures each child's position before a DOM mutation,
  // performs the mutation, then animates from the old position to the new one -
  // used so cards visibly glide into place during drag-reorder instead of jumping
  function animateReorder(container, mutationFn, exceptEl){
    const cards = [...container.children];
    const firstRects = new Map();
    cards.forEach(el => firstRects.set(el, el.getBoundingClientRect()));

    mutationFn();

    cards.forEach(el => {
      if(el === exceptEl) return; // the finger-held card is positioned manually, don't FLIP it
      const first = firstRects.get(el);
      if(!first) return;
      const last = el.getBoundingClientRect();
      const dx = first.left - last.left;
      const dy = first.top - last.top;
      if(Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5){
        el.style.transition = 'none';
        el.style.transform = `translate(${dx}px, ${dy}px)`;
        requestAnimationFrame(()=>{
          // smooth, slightly-springy glide so the other cards flow out of the way (iOS-style)
          el.style.transition = 'transform .42s cubic-bezier(.34,1.18,.36,1)';
          el.style.transform = '';
        });
      }
    });
  }

  // lets the user drag a whole folder group (.cluster-group) up/down within the
  // folder list; on drop, reorders the `folders` array to match the new DOM order
  function wireFolderDragReorder(listEl){
    listEl.addEventListener('dragover', (e)=>{
      const draggingEl = listEl.querySelector('.cluster-group.dragging');
      if(!draggingEl) return;
      e.preventDefault();
      const afterEl = getDragAfterElement(listEl, e.clientY, '.cluster-group');
      const alreadyInPlace = afterEl == null ? listEl.lastElementChild === draggingEl : afterEl.previousElementSibling === draggingEl;
      if(alreadyInPlace) return;
      animateReorder(listEl, ()=>{
        if(afterEl == null) listEl.appendChild(draggingEl);
        else listEl.insertBefore(draggingEl, afterEl);
      });
    });
    listEl.addEventListener('drop', (e)=>{
      e.preventDefault();
      const orderedNames = [...listEl.querySelectorAll('.cluster-group[data-folder-name]')].map(el => el.dataset.folderName);
      folders.sort((a,b) => orderedNames.indexOf(a.name) - orderedNames.indexOf(b.name));
      saveFolders();
      renderFolders();
    });
  }

  // lets the user drag a .client-card up/down within `bodyEl` with the mouse;
  // on drop, reads the resulting DOM order and hands the list of client IDs to persistFn
  function wireDragReorder(bodyEl, persistFn){
    bodyEl.addEventListener('dragover', (e)=>{
      const draggingEl = bodyEl.querySelector('.client-card.dragging');
      if(!draggingEl) return;
      e.preventDefault();
      const afterEl = getDragAfterElement(bodyEl, e.clientY);
      const alreadyInPlace = afterEl == null ? bodyEl.lastElementChild === draggingEl : afterEl.previousElementSibling === draggingEl;
      if(alreadyInPlace) return;
      animateReorder(bodyEl, ()=>{
        if(afterEl == null) bodyEl.appendChild(draggingEl);
        else bodyEl.insertBefore(draggingEl, afterEl);
      });
    });
    bodyEl.addEventListener('drop', (e)=>{
      e.preventDefault();
      const ids = [...bodyEl.querySelectorAll('.client-card')].map(el => el.dataset.clientId);
      persistFn(ids);
    });

    // ---- touch drag (mobile): HTML5 drag-and-drop doesn't fire from a finger, so we
    // reproduce it with touch events. Press-and-hold a card's header, then slide: the card
    // lifts and follows the finger while the others flow out of the way (FLIP), and it
    // settles gracefully into its slot on release. A quick tap still just opens the card. ----
    let tCard = null, tTimer = null, tDragging = false, tStartY = 0, tStartX = 0;
    let grabOffset = 0, curTranslate = 0, settling = false;
    const HOLD_MS = 240, CANCEL_PX = 12;

    // slide the held card so its top edge tracks (fingerY - grabOffset), regardless of
    // which slot it now occupies in the DOM
    function followFinger(fingerY){
      const naturalTop = tCard.getBoundingClientRect().top - curTranslate; // rect includes current transform
      curTranslate = (fingerY - grabOffset) - naturalTop;
      tCard.style.transform = `translateY(${curTranslate}px)`; // no scale: card keeps its width so it can't be clipped at the sides inside the folder bounds
    }

    bodyEl.addEventListener('touchstart', (e)=>{
      if(e.touches.length !== 1 || settling) return;
      const card = e.target.closest('.client-card');
      if(!card || card.parentElement !== bodyEl) return;
      // start a drag only from the header row, never from a control (button / input / toggle / badge)
      if(!e.target.closest('.card-summary-row')) return;
      if(e.target.closest('button, input, select, textarea, a, .handled-toggle-wrap, .pos-number-badge, .cactions')) return;
      const t = e.touches[0];
      tCard = card; tStartY = t.clientY; tStartX = t.clientX; tDragging = false;
      tTimer = setTimeout(()=>{
        tDragging = true;
        curTranslate = 0;
        grabOffset = tStartY - card.getBoundingClientRect().top;
        card.classList.add('touch-dragging'); // shadow + #4394f7 border signal the lift; no scale so the sides never clip
        card.style.transform = 'translateY(0)';
        if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(_){ } }
      }, HOLD_MS);
    }, { passive:true });

    bodyEl.addEventListener('touchmove', (e)=>{
      if(!tCard) return;
      const t = e.touches[0];
      if(!tDragging){
        // moved before the hold completed → it's a scroll, not a drag: let the page scroll
        if(Math.abs(t.clientY - tStartY) > CANCEL_PX || Math.abs(t.clientX - tStartX) > CANCEL_PX){
          clearTimeout(tTimer); tCard = null;
        }
        return;
      }
      e.preventDefault(); // lock page scroll while dragging the card
      const afterEl = getDragAfterElement(bodyEl, t.clientY);
      const inPlace = afterEl == null ? bodyEl.lastElementChild === tCard : afterEl.previousElementSibling === tCard;
      if(!inPlace){
        // flow the OTHER cards into their new spots; the held card is repositioned by hand
        animateReorder(bodyEl, ()=>{
          if(afterEl == null) bodyEl.appendChild(tCard);
          else bodyEl.insertBefore(tCard, afterEl);
        }, tCard);
      }
      followFinger(t.clientY);
    }, { passive:false });

    const endTouchDrag = ()=>{
      clearTimeout(tTimer);
      if(tDragging && tCard){
        const card = tCard;
        settling = true;
        // glide from wherever the finger left it back down into its slot, then persist
        card.style.transition = 'transform .26s cubic-bezier(.2,.85,.25,1), box-shadow .26s ease';
        card.style.transform = 'translateY(0)';
        const ids = [...bodyEl.querySelectorAll('.client-card')].map(el => el.dataset.clientId);
        let done = false;
        const finish = ()=>{
          if(done) return; done = true;
          card.style.transition = ''; card.style.transform = '';
          card.classList.remove('touch-dragging');
          settling = false;
          persistFn(ids);
        };
        card.addEventListener('transitionend', function te(ev){ if(ev.propertyName==='transform'){ card.removeEventListener('transitionend', te); finish(); } });
        setTimeout(finish, 340); // safety net if transitionend doesn't fire
      }
      tCard = null; tDragging = false;
    };
    bodyEl.addEventListener('touchend', endTouchDrag);
    bodyEl.addEventListener('touchcancel', endTouchDrag);
  }

  function renameCluster(key, newName){
    const clean = (newName || "").trim();
    if(clean) clusterNames[key] = clean;
    else delete clusterNames[key]; // empty name = revert to the automatic name
    saveClusterNames();
    renderAll();
  }

  function ensureFolder(name, color){
    const clean = (name || "").trim();
    if(!clean) return "";
    let existing = folders.find(f=>f.name === clean);
    if(!existing){
      folders.push({ name: clean, color: color || colorForName(clean) });
      saveFolders();
    } else if(color && existing.color !== color){
      existing.color = color;
      saveFolders();
    }
    return clean;
  }

  // renames a folder, and updates every place that references it by name: the
  // clients assigned to it, the road-route cache, and the currently-open route view.
  function renameFolder(folder, newName){
    const clean = (newName || "").trim();
    if(!clean || clean === folder.name) return;
    if(folders.some(f => f !== folder && f.name === clean)){
      alert(`כבר קיימת תיקייה בשם "${clean}" - בחרו שם אחר.`);
      return;
    }
    const oldName = folder.name;
    clients.forEach(c=>{
      if((c.folder||"") === oldName) c.folder = clean;
    });
    if(roadRouteCache[oldName]){
      roadRouteCache[clean] = roadRouteCache[oldName];
      delete roadRouteCache[oldName];
    }
    if(selectedFolderForRoute === oldName) selectedFolderForRoute = clean;
    if(openFolderNames.has(oldName)){ openFolderNames.delete(oldName); openFolderNames.add(clean); }
    folder.name = clean;
    saveFolders();
    saveData();
    renderAll();
  }

  function populateFolderSelect(){
    const sel = document.getElementById('f-folder');
    const current = sel.value;
    sel.innerHTML = '<option value="">— בלי תיקייה —</option>' +
      folders.map(f=>`<option value="${escapeHtml(f.name)}">${escapeHtml(f.name)}</option>`).join('') +
      '<option value="__new__">+ תיקייה חדשה...</option>';
    // keep the current selection if it still exists as an option
    if([...sel.options].some(o=>o.value === current)) sel.value = current;
  }

  function toGeoItem(feature){
    const placeTypes = feature.place_type || [];
    const isAddressOrRoad = placeTypes.includes('address') || placeTypes.includes('road');
    let road = isAddressOrRoad ? (feature.text || "") : "";
    const house = feature.address || "";
    // find the city/place name from the feature's context hierarchy, preferring
    // the most specific administrative level available
    let city = "";
    const context = feature.context || [];
    if(!road){
      // this isn't an address/road feature itself (e.g. it's a business/POI) -
      // the street it's on is usually one level up in the context hierarchy
      const streetMatch = context.find(ctx => (ctx.id||"").startsWith("street."));
      if(streetMatch) road = streetMatch.text || "";
    }
    const cityPriority = ['municipality','place','locality','region','subregion','county','joint_municipality','municipal_district','neighbourhood'];
    for(const pref of cityPriority){
      const match = context.find(ctx => (ctx.id||"").startsWith(pref + "."));
      if(match){ city = match.text || ""; break; }
    }
    // fallback if the context hierarchy didn't yield a city: place_name is
    // typically "street number, city, country" - the second-to-last segment
    // is usually the city when nothing else is available
    if(!city && feature.place_name){
      const parts = feature.place_name.split(",").map(p=>p.trim()).filter(Boolean);
      if(parts.length >= 2) city = parts[parts.length - 2];
    }
    if(!road && feature.place_name){
      const parts = feature.place_name.split(",").map(p=>p.trim()).filter(Boolean);
      if(parts.length >= 3) road = parts[parts.length - 3];
    }
    let label = [ [road, house].filter(Boolean).join(" "), city ].filter(Boolean).join(", ");
    if(!label) label = feature.place_name || feature.text || "";
    const center = feature.center || [null, null];
    return { lat: center[1], lon: center[0], city, road, house, display_name: feature.place_name, label };
  }

  // MapTiler's free tier allows far more throughput than Nominatim's 1/sec public
  // limit, but we still keep a small queue+gap as a courteous, simple safety net.
  let lastRequestAt = 0;
  let requestQueue = Promise.resolve();
  const MIN_GAP_MS = 150;
  function scheduleRequest(fn){
    const runNext = requestQueue.then(async ()=>{
      const wait = Math.max(0, MIN_GAP_MS - (Date.now() - lastRequestAt));
      if(wait > 0) await new Promise(r=>setTimeout(r, wait));
      lastRequestAt = Date.now();
      return fn();
    });
    // keep the queue alive even if this particular call throws
    requestQueue = runNext.catch(()=>{});
    return runNext;
  }

  async function maptilerSearch(query, limit){
    const clampedLimit = Math.max(1, Math.min(10, limit || 10)); // MapTiler rejects anything outside 1-10 with a 400
    return scheduleRequest(async ()=>{
      const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(query)}.json?key=${MAPTILER_API_KEY}&country=il&language=he&limit=${clampedLimit}`;
      const res = await fetch(url);
      if(!res.ok) throw new Error("geocode failed (" + res.status + ")");
      return res.json();
    });
  }

  // searches specifically for a business/point-of-interest by name, instead of a
  // plain street address - used by the "find address by business name" lookup
  // searches for a business by name (no type restriction, unlike a pure address
  // search this relies on MapTiler's own relevance ranking to surface the business)
  async function geocodeBusinessName(name, limit){
    const clampedLimit = Math.max(1, Math.min(10, limit || 8));
    return scheduleRequest(async ()=>{
      const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(name)}.json?key=${MAPTILER_API_KEY}&country=il&language=he&limit=${clampedLimit}`;
      const res = await fetch(url);
      if(!res.ok) throw new Error("geocode failed (" + res.status + ")");
      const data = await res.json();
      const features = (data && data.features) || [];
      return features.map(toGeoItem);
    });
  }

  async function geocodeMulti(address, limit){
    const data = await maptilerSearch(address, limit);
    const features = (data && data.features) || [];
    return features.map(toGeoItem);
  }

  // same street/road can appear many times (once per building) - keep only one entry per
  // exact road+house-number combination, so a specific address a user searched for isn't
  // silently replaced by a different building on the same street.
  function dedupeStreets(results){
    const seen = new Set();
    const out = [];
    for(const r of results){
      const key = (r.road || r.label).trim() + "|" + (r.house || "") + "|" + r.city;
      if(!seen.has(key)){ seen.add(key); out.push(r); }
    }
    return out;
  }

  // filter out results whose actual city doesn't match what the user typed, so a
  // street from a neighboring city doesn't slip in just because the text was similar.
  function normalizeCityText(s){
    return (s || "").replace(/["'׳״\-]/g, "").replace(/\s+/g, "").toLowerCase();
  }
  function filterByCity(results, cityParam){
    const target = normalizeCityText(cityParam);
    if(!target) return results;
    return results.filter(r=>{
      const rc = normalizeCityText(r.city);
      if(!rc) return true; // couldn't extract a city for this result - don't punish it for that
      return rc.includes(target) || target.includes(rc);
    });
  }

  // resolves street/number/city fields into candidates. Combines street+city into one
  // natural-language query (the way a person would search it) - this is a single Nominatim
  // request per lookup, kept simple and fast so we stay well within its usage limits.
  async function geocodeFields(streetParam, cityParam, displayLimit){
    const rawLimit = 10; // MapTiler's hard max is 10 - a higher value gets rejected with 400
    if(cityParam){
      const queryText = (streetParam ? streetParam + ", " : "") + cityParam + ", ישראל";
      const raw = await geocodeMulti(queryText, rawLimit);
      const filtered = filterByCity(dedupeStreets(raw), cityParam);
      return filtered.slice(0, displayLimit);
    }
    if(streetParam){
      const results = await geocodeMulti(streetParam + ", ישראל", rawLimit);
      return dedupeStreets(results).slice(0, displayLimit);
    }
    return [];
  }

  function computeClusters(){
    const pts = clients.map((c,i)=>({i, lat:c.lat, lon:c.lon}));
    const visited = new Array(pts.length).fill(false);
    const groups = [];
    for(let i=0;i<pts.length;i++){
      if(visited[i]) continue;
      const stack=[i]; visited[i]=true; const members=[i];
      while(stack.length){
        const cur = stack.pop();
        for(let j=0;j<pts.length;j++){
          if(!visited[j] && haversine(pts[cur].lat,pts[cur].lon,pts[j].lat,pts[j].lon) <= threshold){
            visited[j]=true; stack.push(j); members.push(j);
          }
        }
      }
      groups.push(members);
    }
    // dominant city of a raw cluster (the city most of its members share)
    const dominantCityOf = (members)=>{
      const cityCounts = {};
      members.forEach(m=>{ const c = clients[m].city || ""; if(c) cityCounts[c] = (cityCounts[c]||0)+1; });
      let dominantCity = "", best = 0;
      Object.entries(cityCounts).forEach(([c,count])=>{ if(count>best){ best=count; dominantCity = c; } });
      return dominantCity;
    };
    // Keep pieces of the same area together. When the radius shrinks and one area
    // (e.g. "אזור תל אביב-יפו") breaks into several clusters, every piece still shares the
    // same dominant city - so we group clusters by dominant city and render the pieces one
    // under the other, instead of letting the size-sort scatter them across the list.
    // city-groups are ordered by their largest piece; within a group, largest piece first;
    // clusters with no city each stand on their own.
    let clusterObjs = groups.map(members => ({ members, dominantCity: dominantCityOf(members) }));
    const cityGroups = new Map();
    clusterObjs.forEach((co, i)=>{
      const gkey = co.dominantCity || ('␀nocity' + i);
      if(!cityGroups.has(gkey)) cityGroups.set(gkey, []);
      cityGroups.get(gkey).push(co);
    });
    const orderedGroups = [...cityGroups.values()];
    orderedGroups.forEach(g => g.sort((a,b)=> b.members.length - a.members.length));
    orderedGroups.sort((a,b)=> b[0].members.length - a[0].members.length);
    clusterObjs = orderedGroups.flat();
    clusters = clusterObjs.map((co, idx)=>{
      const { members, dominantCity } = co;
      const defaultName = dominantCity ? (members.length>1 ? ("אזור " + dominantCity) : dominantCity) : ("אזור " + (idx+1));
      // the custom-name key is the exact set of client IDs in this cluster (order-independent).
      // this means a rename sticks to precisely the addresses you renamed - if the cluster later
      // splits, the new key for each half differs, so your custom name stays only on the half
      // that still has that exact membership, and never jumps onto the other half.
      const key = members.map(m=>clients[m].id).slice().sort().join(",");
      const name = clusterNames[key] || defaultName;
      return { members, color: PALETTE[idx % PALETTE.length], name, key, defaultName };
    });
    clusterOfClient = {};
    clusters.forEach((cl, idx)=>{
      cl.members.forEach(m=>{ clusterOfClient[clients[m].id] = idx; });
    });

    // drop custom names whose exact membership no longer matches any current cluster
    // (e.g. after a split) - keeps storage tidy and avoids reviving stale overrides
    const validKeys = new Set(clusters.map(cl=>cl.key));
    let prunedAny = false;
    Object.keys(clusterNames).forEach(k=>{
      if(!validKeys.has(k)){ delete clusterNames[k]; prunedAny = true; }
    });
    if(prunedAny) saveClusterNames();

    let prunedOrderAny = false;
    Object.keys(clusterOrder).forEach(k=>{
      if(!validKeys.has(k)){ delete clusterOrder[k]; prunedOrderAny = true; }
    });
    if(prunedOrderAny) saveClusterOrder();
  }

  function pinIcon(color, label){
    const svg = `<svg width="30" height="40" viewBox="0 0 30 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 0C6.72 0 0 6.72 0 15c0 11.25 15 25 15 25s15-13.75 15-25C30 6.72 23.28 0 15 0z" fill="${color}" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="15" cy="15" r="7.5" fill="#ffffff"/>
      <text x="15" y="19.2" text-anchor="middle" font-size="10" font-weight="700" font-family="Arial, sans-serif" fill="${color}">${label}</text>
    </svg>`;
    return L.divIcon({
      html: svg, className: '', iconSize:[30,40], iconAnchor:[15,40], popupAnchor:[0,-34]
    });
  }

  function renderMap(){
    markersLayer.clearLayers();
    const bounds = [];

    // folder order/position always applies to a pin (if the client has a folder),
    // regardless of whether that folder's 🧭 is currently toggled on - this keeps the
    // map consistent with whatever order you've set up in the folder, at all times.
    const folderPositionByClientId = {};
    folders.forEach(folder=>{
      const folderMembers = clients.filter(c => (c.folder||"") === folder.name && !c.skipRoute && !c.handled);
      if(!folderMembers.length) return;
      const ordered = getOrderedFolderMembers(folder, folderMembers);
      ordered.forEach((c, idx)=>{
        folderPositionByClientId[c.id] = { position: idx+1, color: folder.color };
      });
    });

    clusters.forEach((cl, cIdx)=>{
      const inRouteMode = routeModeKeys.has(cl.key);
      const orderedMembers = getOrderedClusterMembers(cl, cl.members);
      const routeLatLngs = [];
      const routeMemberObjects = [];
      const routeFolderColors = [];
      let visiblePosIdx = 0;
      orderedMembers.forEach((m)=>{
        const c = clients[m];
        const assignedFolder = c.folder ? folders.find(f => f.name === c.folder) : null;
        if(assignedFolder && assignedFolder.mapVisible === false) return; // whole folder hidden from the map for now
        if(!c.folder && !unassignedMapVisible) return; // "בלי תיקייה" bucket hidden from the map for now
        if(c.handled) return; // marked handled - off the map for 12 hours, then reverts automatically
        if(c.inactive) return; // inactive client - not shown on the map
        if(c.skipRoute) return; // "דלג על כתובת זו היום" - drops off the map automatically until re-included
        bounds.push([c.lat, c.lon]);
        const folderInfo = folderPositionByClientId[c.id];
        const label = (!inRouteMode && folderInfo) ? folderInfo.position : visiblePosIdx+1;
        visiblePosIdx++;
        const pinColor = assignedFolder ? assignedFolder.color : cl.color;
        const marker = L.marker([c.lat, c.lon], { icon: pinIcon(pinColor, label) });
        marker.__clientId = c.id;
        marker.bindPopup(
          `<div style="min-width:180px">
            <div style="font-weight:700;margin-bottom:2px">${c.business ? escapeHtml(c.business) : escapeHtml(c.name)}</div>
            ${c.name ? `<div style="font-size:.72rem;color:#8a8f93;margin-bottom:4px">שם לחשבונית: ${escapeHtml(c.name)}</div>` : ""}
            ${c.contact ? `<div style="font-size:.72rem;color:#8a8f93;margin-bottom:4px">איש קשר: ${escapeHtml(c.contact)}</div>` : ""}
            <div style="font-size:.8rem;color:#5B6B6A">${escapeHtml(c.address)}</div>
            ${c.phone ? `<div style="font-size:.8rem;color:#3E5C76;margin-top:2px">📞 <a href="tel:${escapeHtml(telHref(c.phone))}" style="color:#3E5C76">${escapeHtml(c.phone)}</a></div>` : ""}
            ${c.notes ? `<div style="font-size:.78rem;margin-top:4px">${escapeHtml(c.notes)}</div>` : ""}
            <div style="margin-top:8px;display:flex;gap:6px">
              <button onclick="window.__deleteClient('${c.id}')" style="font-size:.72rem;border:1px solid #ddd;border-radius:15px;padding:3px 8px;cursor:pointer;color:#9C3B2E;background:#fff">מחק</button>
            </div>
          </div>`
        );
        marker.addTo(markersLayer);
        if(inRouteMode && !c.skipRoute && !c.handled){
          routeLatLngs.push([c.lat, c.lon]);
          routeMemberObjects.push(c);
          routeFolderColors.push(assignedFolder ? assignedFolder.color : null);
        }
      });
      if(inRouteMode && routeLatLngs.length > 1){
        // if every address on this route belongs to the same folder, use that folder's
        // color for the line too - otherwise (mixed/no folders) keep the default green
        const uniqueFolderColors = new Set(routeFolderColors);
        const routeColor = (uniqueFolderColors.size === 1 && !uniqueFolderColors.has(null))
          ? routeFolderColors[0]
          : null;

        const fp = routeFingerprint(routeMemberObjects);
        const cachedRoad = clusterRoadRouteCache[cl.key];
        if(cachedRoad && cachedRoad.fingerprint === fp){
          // real road-following geometry already known for this exact stop order
          drawGlowPolyline(cachedRoad.coords, markersLayer, routeColor);
        } else {
          // draw the straight-line fallback immediately, then swap it for the real
          // road path as soon as it arrives
          drawGlowPolyline(routeLatLngs, markersLayer, routeColor);
          ensureClusterRoadRoute(cl, routeMemberObjects).then(()=>{
            if(routeModeKeys.has(cl.key)){
              renderMap();
              renderSidebar();
            }
          }).catch(()=>{ /* keep the straight-line fallback silently if the road route can't be fetched */ });
        }
      }
    });

    return bounds;
  }

  function telHref(phone){
    return (phone || "").replace(/[^\d+]/g, "");
  }

  function waHref(phone){
    let digits = (phone || "").replace(/\D/g, "");
    if(digits.startsWith("0")) digits = "972" + digits.slice(1);
    return `https://wa.me/${digits}`;
  }
